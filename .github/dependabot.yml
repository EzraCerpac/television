version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: 'rust-toolchain'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      rust-toolchain:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
